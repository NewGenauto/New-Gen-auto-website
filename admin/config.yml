# ============================================================
# New Gen Auto (Pvt) Ltd website admin (Decap CMS + DecapBridge)
# Admin page: https://newgenauto.github.io/New-Gen-auto-website/admin/
# ============================================================

# DecapBridge classic auth (email + password login)
backend:
  name: git-gateway
  repo: NewGenauto/New-Gen-auto-website
  branch: main
  identity_url: https://auth.decapbridge.com/sites/f183fb9c-9003-4843-8659-ec9a271727b9
  gateway_url: https://gateway.decapbridge.com

  # Records who made each change
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

site_url: https://newgenauto.github.io/New-Gen-auto-website/
display_url: https://newgenauto.github.io/New-Gen-auto-website/
logo_url: https://newgenauto.github.io/New-Gen-auto-website/images/logo-full.png

media_folder: images
public_folder: /images

collections:
  - name: website
    label: Website content
    editor:
      preview: false
    files:
      # ---------------- Cars ----------------
      - name: cars
        label: Cars
        file: data/cars.json
        format: json
        fields:
          - name: cars
            label: Cars
            label_singular: Car
            widget: list
            summary: "{{fields.name}} (LKR {{fields.price}})"
            collapsed: true
            fields:
              - { name: name, label: Car name, widget: string, hint: "e.g. Black AION V" }
              - { name: make, label: Brand, widget: string, required: false, hint: "Shown small above the name, e.g. GAC AION or TOYOTA" }
              - { name: image, label: Photo, widget: image, hint: "A wide, side-on landscape photo works best" }
              - { name: tag, label: Label on photo, widget: string, required: false, hint: "e.g. Self-Drive or With Chauffeur" }
              - { name: price, label: Price (LKR), widget: string, hint: "Numbers only, e.g. 12,000" }
              - { name: unit, label: After the price, widget: string, required: false, default: "/day", hint: "e.g. /day or onwards" }
              - name: specs
                label: Features
                label_singular: Feature
                widget: list
                required: false
                hint: "Small grey boxes on the card, e.g. 5 Seats, Automatic, A/C"
                field: { name: feature, label: Feature, widget: string }
              - name: services
                label: Available for
                widget: select
                multiple: true
                hint: "Which search and filter buttons this car appears under"
                options:
                  - { label: Self-Drive, value: Full Day Rental }
                  - { label: With Chauffeur, value: Chauffeur Service }
                  - { label: Airport Pickup, value: Airport Pickup }
              - { name: electric, label: "Electric car (shows the green EV badge)", widget: boolean, default: true, required: false }
              - { name: show, label: "Show on website (turn off to hide without deleting)", widget: boolean, default: true, required: false }

      # ---------------- Service cards ----------------
      - name: offers
        label: Service cards
        file: data/offers.json
        format: json
        fields:
          - name: offers
            label: Service cards
            label_singular: Card
            widget: list
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: link_text, label: Link text, widget: string, hint: "e.g. From LKR 12,000/day" }
              - name: service
                label: Clicking the card goes to
                widget: select
                options:
                  - { label: Self-Drive cars, value: Full Day Rental }
                  - { label: Chauffeur cars, value: Chauffeur Service }
                  - { label: Airport Pickup cars, value: Airport Pickup }
                  - { label: WhatsApp chat, value: WhatsApp }

      # ---------------- At a glance ----------------
      - name: glance
        label: At a glance boxes
        file: data/glance.json
        format: json
        fields:
          - name: glance
            label: Boxes
            label_singular: Box
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { name: label, label: Small label, widget: string }
              - { name: value, label: Big value, widget: string }

      # ---------------- FAQs ----------------
      - name: faqs
        label: FAQs
        file: data/faqs.json
        format: json
        fields:
          - name: faqs
            label: Questions
            label_singular: Question
            widget: list
            summary: "{{fields.question}}"
            collapsed: true
            fields:
              - { name: question, label: Question, widget: string }
              - { name: answer, label: Answer, widget: text }
