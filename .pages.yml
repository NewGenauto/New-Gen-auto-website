# Pages CMS settings: https://pagescms.org/docs
# Edit the website content at https://app.pagescms.org

media:
  input: images
  output: /images
  categories: [image]
  rename: safe

content:
  - name: cars
    label: Cars
    type: file
    path: data/cars.json
    format: json
    list: true
    fields:
      - name: name
        label: Car name
        type: string
        required: true
        description: "e.g. Black AION V"
      - name: make
        label: Brand
        type: string
        description: "Shown small above the name, e.g. GAC AION or TOYOTA"
      - name: image
        label: Photo
        type: image
        required: true
        description: "A wide, side-on landscape photo works best"
      - name: tag
        label: Label on photo
        type: string
        description: "e.g. Self-Drive or With Chauffeur"
      - name: price
        label: Price (LKR)
        type: string
        required: true
        description: "Numbers only, e.g. 12,000"
      - name: unit
        label: After the price
        type: string
        description: "e.g. /day or onwards"
      - name: specs
        label: Features
        type: string
        list: true
        description: "Small grey boxes on the card, e.g. 5 Seats, Automatic, A/C"
      - name: services
        label: Available for
        type: select
        description: "Which search and filter buttons this car appears under"
        options:
          multiple: true
          values:
            - name: Full Day Rental
              label: Self-Drive
            - name: Chauffeur Service
              label: With Chauffeur
            - name: Airport Pickup
              label: Airport Pickup
      - name: electric
        label: Electric car (shows the green EV badge)
        type: boolean
      - name: show
        label: Show on website (turn off to hide this car without deleting it)
        type: boolean

  - name: offers
    label: Service cards
    type: file
    path: data/offers.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: link_text
        label: Link text
        type: string
        description: "e.g. From LKR 12,000/day"
      - name: service
        label: Clicking the card goes to
        type: select
        options:
          values:
            - name: Full Day Rental
              label: Self-Drive cars
            - name: Chauffeur Service
              label: Chauffeur cars
            - name: Airport Pickup
              label: Airport Pickup cars
            - name: WhatsApp
              label: WhatsApp chat

  - name: glance
    label: At a glance boxes
    type: file
    path: data/glance.json
    format: json
    list: true
    fields:
      - name: label
        label: Small label
        type: string
        required: true
      - name: value
        label: Big value
        type: string
        required: true

  - name: faqs
    label: FAQs
    type: file
    path: data/faqs.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true
